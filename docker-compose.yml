name: pedidos360

services:
  wiremock:
    image: wiremock/wiremock:3.3.1
    ports:
      - "127.0.0.1:8089:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
      - ./wiremock/__files:/home/wiremock/__files:ro
    command: ["--global-response-templating", "--verbose"]
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Define ORACLE_PASSWORD en .env}
      ORACLE_DATABASE: ${ORACLE_DATABASE:-FREEPDB1}
      APP_USER: ${CATALOG_DB_USERNAME:?Define CATALOG_DB_USERNAME en .env}
      APP_USER_PASSWORD: ${CATALOG_DB_PASSWORD:?Define CATALOG_DB_PASSWORD en .env}
      ORDERS_DB_USERNAME: ${ORDERS_DB_USERNAME:?Define ORDERS_DB_USERNAME en .env}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?Define ORDERS_DB_PASSWORD en .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./scripts/ensure-oracle-users.sh:/container-entrypoint-startdb.d/10-ensure-users.sh:ro
    shm_size: "1gb"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          printf '%s\n' 'WHENEVER SQLERROR EXIT SQL.SQLCODE' 'SELECT 1 FROM dual;' 'EXIT;' |
          "$${ORACLE_HOME}/bin/sqlplus" -s "$${APP_USER}/$${APP_USER_PASSWORD}@localhost:1521/$${ORACLE_DATABASE:-FREEPDB1}" > /dev/null
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
    stop_grace_period: 60s
    networks:
      - backend
    restart: unless-stopped

  rabbitmq-1:
    image: rabbitmq:3.13-management-alpine
    # The node name is rabbit@<hostname>: it must match rabbitmq.conf.
    hostname: rabbitmq-1
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Define RABBITMQ_USERNAME en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-pedidos360}
      # Shared secret that lets both nodes join the same cluster.
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Define RABBITMQ_ERLANG_COOKIE en .env}
    volumes:
      - rabbitmq-1-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    # The management UI is published on loopback only, never on a public interface.
    # Docker does not publish ports of a container attached only to `internal: true`
    # networks, so the broker also joins `egress`, a regular bridge.
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  rabbitmq-2:
    image: rabbitmq:3.13-management-alpine
    # The node name is rabbit@<hostname>: it must match rabbitmq.conf.
    hostname: rabbitmq-2
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Define RABBITMQ_USERNAME en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-pedidos360}
      # Shared secret that lets both nodes join the same cluster.
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Define RABBITMQ_ERLANG_COOKIE en .env}
    volumes:
      - rabbitmq-2-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    # The management UI is published on loopback only, never on a public interface.
    # Docker does not publish ports of a container attached only to `internal: true`
    # networks, so the broker also joins `egress`, a regular bridge.
    ports:
      - "127.0.0.1:${RABBITMQ_2_MANAGEMENT_PORT:-15673}:15672"
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Single-node Kafka in KRaft mode (broker + controller in one process, no
  # ZooKeeper). It carries order domain events; RabbitMQ keeps the stock
  # commands. Only on `backend`: the broker port is never published to the host.
  kafka:
    image: apache/kafka:4.3.2
    hostname: kafka
    environment:
      # Fixed cluster id (base64 UUID from `kafka-storage.sh random-uuid`):
      # the data volume is formatted once and reused across restarts.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-lt4pMihWTs2WdoOIy9jBqg}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Clients inside the compose network reach the broker by its service name.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # One broker: internal topics cannot have more than one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Topics are created only by kafka-init: a misspelled topic name fails
      # loudly instead of silently creating a new, empty topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot job: creates the topics of the event contract and exits 0.
  # `--if-not-exists` makes it idempotent, so every `up` can run it again.
  kafka-init:
    image: apache/kafka:4.3.2
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        set -e;
        for topic in pedidos360.order-events pedidos360.order-events.DLT; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic "$$topic" --partitions 3 --replication-factor 1;
        done;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic pedidos360.order-events
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  # Kafka UI, published on loopback only (no authentication of its own).
  # Like RabbitMQ, it also joins `egress` because Docker does not publish
  # ports of a container attached only to `internal: true` networks.
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # Read-only: browse topics, messages and consumer groups; offset resets
      # and topic deletion are done explicitly with the Kafka CLI.
      KAFKA_CLUSTERS_0_READONLY: "true"
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8086}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # SMTP local para los correos de compra como invitado (voucher y reenvío de
  # enlace). Atrapa todos los mensajes: nunca entrega a buzones reales.
  # - SMTP 1025: solo en la red `backend`, sin puerto publicado en el host.
  # - UI web 8025: publicada solo en loopback. Igual que RabbitMQ, necesita la
  #   red `egress` porque Docker no publica puertos de contenedores atados solo
  #   a redes `internal: true`.
  mailpit:
    image: axllent/mailpit:v1.32.0
    environment:
      # Acepta cualquier usuario/clave sin TLS solo si alguien define
      # MAIL_USERNAME en local; con las variables vacías no hay autenticación.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    expose:
      - "1025"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  catalog:
    build:
      context: ../pedidos360-catalog
      dockerfile: Dockerfile
    image: pedidos360/catalog:local
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      PORT: "8082"
      ENTRA_ISSUER: ${ENTRA_ISSUER:?Define ENTRA_ISSUER en .env}
      ENTRA_API_AUDIENCE: ${ENTRA_API_AUDIENCE:?Define ENTRA_API_AUDIENCE en .env}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-https://cognito-idp.us-east-1.amazonaws.com/us-east-1_UmEhPRYdI}
      COGNITO_API_AUDIENCE: ${COGNITO_API_AUDIENCE:-59be26pgg5ginu2sutr8eetgjg}
      COGNITO_JWK_SET_URI: ${COGNITO_JWK_SET_URI:-https://cognito-idp.us-east-1.amazonaws.com/us-east-1_UmEhPRYdI/.well-known/jwks.json}
      ORACLE_URL: jdbc:oracle:thin:@//oracle:1521/${ORACLE_DATABASE:-FREEPDB1}
      ORACLE_USERNAME: ${CATALOG_DB_USERNAME:?Define CATALOG_DB_USERNAME en .env}
      ORACLE_PASSWORD: ${CATALOG_DB_PASSWORD:?Define CATALOG_DB_PASSWORD en .env}
      RABBITMQ_HOST: rabbitmq-1
      RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Define RABBITMQ_USERNAME en .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-pedidos360}
      # Order domain events (docs/MENSAJERIA_KAFKA.md).
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    expose:
      - "8082"
    depends_on:
      oracle:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  orders:
    build:
      context: ../pedidos360-orders
      dockerfile: Dockerfile
    image: pedidos360/orders:local
    environment:
      SPRING_PROFILES_ACTIVE: oracle
      SERVER_PORT: "8081"
      ENTRA_ISSUER: ${ENTRA_ISSUER:?Define ENTRA_ISSUER en .env}
      ENTRA_API_AUDIENCE: ${ENTRA_API_AUDIENCE:?Define ENTRA_API_AUDIENCE en .env}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-https://cognito-idp.us-east-1.amazonaws.com/us-east-1_UmEhPRYdI}
      COGNITO_API_AUDIENCE: ${COGNITO_API_AUDIENCE:-59be26pgg5ginu2sutr8eetgjg}
      COGNITO_JWK_SET_URI: ${COGNITO_JWK_SET_URI:-https://cognito-idp.us-east-1.amazonaws.com/us-east-1_UmEhPRYdI/.well-known/jwks.json}
      ORDERS_DB_URL: jdbc:oracle:thin:@//oracle:1521/${ORACLE_DATABASE:-FREEPDB1}
      ORDERS_DB_USERNAME: ${ORDERS_DB_USERNAME:?Define ORDERS_DB_USERNAME en .env}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?Define ORDERS_DB_PASSWORD en .env}
      CATALOG_SERVICE_URL: http://catalog:8082
      RABBITMQ_HOST: rabbitmq-1
      RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Define RABBITMQ_USERNAME en .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-pedidos360}
      # Order domain events (docs/MENSAJERIA_KAFKA.md).
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Correo del voucher (compra como invitado). En local apunta a Mailpit;
      # en AWS las mismas variables apuntan al SMTP de Amazon SES.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@pedidos360.local}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:4200}
    expose:
      - "8081"
    depends_on:
      oracle:
        condition: service_healthy
      catalog:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  bff:
    build:
      context: ../pedidos360-bff
      dockerfile: Dockerfile
    image: pedidos360/bff:local
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      JWT_MODE: entra
      PORT: "8080"
      SERVER_PORT: "8080"
      ENTRA_ISSUER: ${ENTRA_ISSUER:?Define ENTRA_ISSUER en .env}
      ENTRA_API_AUDIENCE: ${ENTRA_API_AUDIENCE:?Define ENTRA_API_AUDIENCE en .env}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-https://cognito-idp.us-east-1.amazonaws.com/us-east-1_UmEhPRYdI}
      COGNITO_API_AUDIENCE: ${COGNITO_API_AUDIENCE:-59be26pgg5ginu2sutr8eetgjg}
      COGNITO_JWK_SET_URI: ${COGNITO_JWK_SET_URI:-https://cognito-idp.us-east-1.amazonaws.com/us-east-1_UmEhPRYdI/.well-known/jwks.json}
      ORDERS_SERVICE_URL: http://orders:8081
      CATALOG_SERVICE_URL: http://catalog:8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BFF_PORT:-8080}:8080"
    depends_on:
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy
    networks:
      - backend
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ../pedidos360-frontend
      dockerfile: Dockerfile
      args:
        ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Define ENTRA_TENANT_ID en .env}
        ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?Define ENTRA_CLIENT_ID en .env}
        API_SCOPE: ${API_SCOPE:-api://150f51db-4084-4979-b1a1-e6a6e7893a01/access_as_user}
        API_BASE_URL: ${API_BASE_URL:?Define API_BASE_URL en .env}
        REDIRECT_URI: ${REDIRECT_URI:-http://localhost:4200/login}
        POST_LOGOUT_REDIRECT_URI: ${POST_LOGOUT_REDIRECT_URI:-http://localhost:4200/login}
    image: pedidos360/frontend:local
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-4200}:80"
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  messaging-admin:
    build:
      context: ./messaging-admin
    environment:
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Define RABBITMQ_USERNAME en .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-pedidos360}
    # The admin API can delete queues: loopback only, never a public interface.
    ports:
      - "127.0.0.1:${MESSAGING_ADMIN_PORT:-8085}:8085"
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
    networks:
      - backend
      - egress
    restart: unless-stopped

networks:
  backend:
    internal: true
  egress: {}
  edge: {}

volumes:
  oracle-data:
    name: ${COMPOSE_PROJECT_NAME:-pedidos360}_oracle-data
  rabbitmq-1-data:
    name: ${COMPOSE_PROJECT_NAME:-pedidos360}_rabbitmq-1-data
  rabbitmq-2-data:
    name: ${COMPOSE_PROJECT_NAME:-pedidos360}_rabbitmq-2-data
  kafka-data:
    name: ${COMPOSE_PROJECT_NAME:-pedidos360}_kafka-data
