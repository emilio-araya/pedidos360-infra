spring:
  application:
    name: ms-pedidos360-messaging-admin
  rabbitmq:
    # Dos nodos del clúster: si uno cae, el cliente se conecta al otro.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 5s

server:
  port: ${SERVER_PORT:8085}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  messaging:
    admin:
      # Todos los nombres de RabbitMQ que usa este servicio, centralizados aquí.
      dead-letter-exchange: pedidos360-admin.dlx
      dead-letter-suffix: .dlq
      # Prefijos del sistema en marcha (stock.reserve, orders.stock-result,
      # pedidos360.events...): esta API nunca los crea, modifica ni elimina.
      reserved-prefixes:
        - stock.
        - orders.
        - pedidos360.
      # Exchanges del sistema a los que sí se pueden enlazar colas nuevas.
      bindable-exchanges:
        - pedidos360.events
