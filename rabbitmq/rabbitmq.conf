# Two-node cluster formed at boot. Each node lists both peers; the one that
# starts second joins the first. Both share the same Erlang cookie.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# With two nodes there is no majority: pause_minority would pause the
# surviving node too. autoheal keeps both running and, after a network split,
# restarts the side with fewer clients so the cluster converges again.
cluster_partition_handling = autoheal

loopback_users.guest = true
